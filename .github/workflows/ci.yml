name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Fast Tests & Knowledge Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Code formatting check (Ruff)
        run: uv run ruff format --check src/ tests/

      - name: Linter check (Ruff)
        run: uv run ruff check src/ tests/

      - name: Run fast unit & integration tests
        run: uv run pytest -m "not slow" -v

      - name: Knowledge Base Health Audit (KnowledgeLinter)
        run: uv run wikid-steward lint --dir .
