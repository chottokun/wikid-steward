# wikid-steward Comprehensive Configuration (v7.0)
# Note: Sensitive variables (like credentials, API keys) should be placed in your `.env` file instead.
# Environment variables will override any values configured here.

# 1. LLM 接続設定 (OpenAI 互換 API)
llm:
  provider: "ollama"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"               # 機微なAPIキーは .env (LLM_API_KEY または OPENAI_API_KEY) に書くことを推奨します
  model: "gemma4:latest"
  temperature: 0.2
  max_tokens: 2048
  target_language: "Japanese"     # 出力言語の統一（多言語統制）

# 2. VLM 画像自動要約設定
vlm:
  enabled: true
  provider: "ollama"
  model: "qwen3.5:4b"
  endpoint: "http://localhost:11434"
  api_key: ""                     # 機微なAPIキーは .env (VLM_API_KEY) に書くことを推奨します
  prompt: "この画像の概要を1〜2文程度で簡潔に日本語で説明してください。"

# 3. ディレクトリ構成設定
paths:
  raw_dir: "_raw"
  raw_sources_dir: "raw_sources"
  staging_dir: "staging"
  wiki_dir: "wiki"
  stubs_dir: "wiki/stubs"         # 未定義スタブ隔離ディレクトリ

# 4. 用語抽出 & 相互 WikiLink 防護設定
relinker:
  mode: "first_hit_per_section"   # "first_hit_per_section" (大見出しごとに初回のみ) または "all"
  stop_words:
    - "AI"
    - "NLP"
    - "LLM"
    - "LLMS"
    - "DATA"
    - "OUTPUT"
    - "FILE"
    - "PDF"
    - "PAPER"
    - "MODEL"
    - "SYSTEM"
  min_term_length: 3

# 5. バックリンク自動逆合成 (Retro-Compilation) 設定
retro_compilation:
  min_backlinks: 3                # 自動逆合成をトリガーする最小被リンク数 (N)

# 6. ベクトル DB (Qdrant) & 1-Hop グラフ拡張検索設定
vector_db:
  provider: "qdrant"
  url: "http://localhost:6333"
  api_key: ""                     # Qdrant Cloud等のAPIキー。機微情報のため .env (VECTOR_DB_API_KEY) への記載を推奨します
  collection_name: "wikid_steward_knowledge"
  max_context_tokens: 4000
  embedding_provider: "ollama"
  embedding_base_url: "http://localhost:11434/v1"
  embedding_model: "qwen3-embedding:0.6b"
  embedding_api_key: ""           # 埋め込みAPIキー。機微情報のため .env (VECTOR_DB_EMBEDDING_API_KEY) への記載を推奨します
  max_hub_degree: 25            # 巨大ハブノード度数閾値 (これを超えたら簡易参照化)
  max_traversal_tokens: 1200    # 1-Hop 巡回読み込みトークン上限
