# wikid-steward Comprehensive Configuration

# 1. LLM 接続設定 (OpenAI 互換 API)
llm:
  provider: "ollama"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "gemma4:latest"
  temperature: 0.2
  max_tokens: 2048

# 2. VLM 画像自動要約設定
vlm:
  enabled: true
  provider: "ollama"
  model: "qwen3.5:4b"
  endpoint: "http://localhost:11434"

# 3. 4層ライフサイクル・ディレクトリ構成設定
paths:
  raw_dir: "_raw"
  raw_sources_dir: "raw_sources"
  staging_dir: "staging"
  wiki_dir: "wiki"

# 4. 用語抽出 & 相互 WikiLink 防護設定
relinker:
  stop_words:
    - "AI"
    - "NLP"
    - "LLM"
    - "LLMS"
    - "DATA"
    - "OUTPUT"
    - "FILE"
    - "PDF"
    - "PAPER"
    - "MODEL"
    - "SYSTEM"
  min_term_length: 3

# 5. ベクトル DB (Qdrant) & 1-Hop グラフ拡張検索設定
vector_db:
  provider: "qdrant"
  url: "http://localhost:6333"
  collection_name: "wikid_steward_knowledge"
  max_context_tokens: 4000
  embedding_provider: "ollama"
  embedding_base_url: "http://localhost:11434/v1"
  embedding_model: "qwen3-embedding:0.6b"
  max_hub_degree: 25            # 巨大ハブノード度数閾値 (これを超えたら簡易参照化)
  max_traversal_tokens: 1200    # 1-Hop 巡回読み込みトークン上限
