[project]
name = "wikid-steward"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chottokun", email = "cbwgift@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling-lib @ git+https://github.com/chottokun/docling-markdown-generator.git",
    "pillow>=10.0.0",
    "watchdog>=4.0.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "openai>=3.0.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",
]

[project.scripts]
wikid-steward = "wikid_steward.cli:main"


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.0",
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (Docling real PDF / large model inference) (deselect with '-m \"not slow\"')",
    "integration: marks integration tests that require external models or heavy dependencies",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true


